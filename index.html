<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Independent records. Listen to the full release and discover the band.">
  <meta name="color-scheme" content="dark light">
  <title>Record player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23181818'/%3E%3Ccircle cx='20' cy='20' r='7' fill='%235fbd8b'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23181818'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead"><div class="preferences"><label class="sr-only" for="language">Language</label><select id="language"><option value="en">English</option><option value="it">Italiano</option></select><button id="theme" class="theme" aria-label="Switch to light mode">☀</button></div></header>
    <main id="main" aria-busy="true"><p id="loading" role="status">Loading record…</p></main>
    <footer id="footer"></footer>
  </div>
  <noscript>This record player needs JavaScript enabled to load the album and play its tracks.</noscript>
</body>
</html>
